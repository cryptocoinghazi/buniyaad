<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Owner dashboard | Buniyaad Builders &amp; Suppliers</title>
    <style>
      [data-admin] {
        --ink: #17231c;
        --muted: #5e685f;
        --paper: #fffdf7;
        --surface: #ffffff;
        --sand: #eee4cf;
        --sand-soft: #f8f2e7;
        --brick: #a8462f;
        --brick-dark: #773120;
        --green: #1f5a3d;
        --green-soft: #e7f1eb;
        --line: #ded8ca;
        --danger: #a12c2c;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(rgba(168, 70, 47, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(168, 70, 47, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      [data-admin] *,
      [data-admin] *::before,
      [data-admin] *::after {
        box-sizing: border-box;
      }

      [data-admin] a {
        color: inherit;
      }

      [data-admin] button,
      [data-admin] input,
      [data-admin] select,
      [data-admin] textarea {
        font: inherit;
      }

      [data-admin] .skip-link {
        position: fixed;
        z-index: 50;
        top: 0.5rem;
        left: 0.5rem;
        padding: 0.65rem 0.85rem;
        border-radius: 0.5rem;
        color: #fff;
        background: var(--ink);
        transform: translateY(-150%);
      }

      [data-admin] .skip-link:focus {
        transform: translateY(0);
      }

      [data-admin] .preview-notice {
        margin: 0;
        padding: 0.72rem 1rem;
        color: #fff;
        background: var(--brick-dark);
        text-align: center;
        font-weight: 750;
        letter-spacing: 0.01em;
      }

      [data-admin] .admin-header,
      [data-admin] .admin-main {
        width: min(1120px, calc(100% - 2rem));
        margin-inline: auto;
      }

      [data-admin] .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-block: 1.25rem;
      }

      [data-admin] .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      [data-admin] .brand-mark {
        display: grid;
        width: 2.7rem;
        height: 2.7rem;
        place-items: center;
        border-radius: 0.72rem;
        color: #fff;
        background: var(--green);
        font-weight: 900;
      }

      [data-admin] .brand strong,
      [data-admin] .brand small {
        display: block;
      }

      [data-admin] .brand small {
        color: var(--muted);
      }

      [data-admin] .back-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        font-weight: 700;
        text-decoration: none;
      }

      [data-admin] .intro {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        align-items: end;
        padding: clamp(1.4rem, 5vw, 3rem);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--sand-soft);
        box-shadow: 0 14px 40px rgba(38, 31, 22, 0.08);
      }

      [data-admin] .eyebrow {
        margin: 0 0 0.4rem;
        color: var(--brick);
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      [data-admin] h1,
      [data-admin] h2,
      [data-admin] h3,
      [data-admin] p {
        margin-top: 0;
      }

      [data-admin] h1 {
        max-width: 720px;
        margin-bottom: 0.55rem;
        font-size: clamp(2rem, 7vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      [data-admin] h2 {
        margin-bottom: 0.35rem;
        font-size: clamp(1.35rem, 3vw, 1.9rem);
      }

      [data-admin] h3 {
        margin-bottom: 0.25rem;
        font-size: 1rem;
      }

      [data-admin] .intro p:last-child,
      [data-admin] .section-heading p,
      [data-admin] .helper,
      [data-admin] .empty-state,
      [data-admin] .card-meta {
        color: var(--muted);
      }

      [data-admin] .local-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.65rem 0.8rem;
        border-radius: 999px;
        color: var(--green);
        background: var(--green-soft);
        font-size: 0.85rem;
        font-weight: 800;
        white-space: nowrap;
      }

      [data-admin] .section-nav {
        display: flex;
        gap: 0.55rem;
        margin: 1rem 0 2rem;
        padding: 0.35rem 0 0.75rem;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      [data-admin] .section-nav a {
        flex: 0 0 auto;
        padding: 0.55rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        font-size: 0.9rem;
        font-weight: 750;
        text-decoration: none;
      }

      [data-admin] .panel {
        margin-block: 1rem;
        padding: clamp(1rem, 4vw, 1.6rem);
        border: 1px solid var(--line);
        border-radius: 1.15rem;
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(38, 31, 22, 0.055);
        scroll-margin-top: 1rem;
      }

      [data-admin] .section-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      [data-admin] .section-heading p {
        max-width: 690px;
        margin-bottom: 0;
      }

      [data-admin] .count {
        min-width: 2rem;
        padding: 0.25rem 0.52rem;
        border-radius: 999px;
        color: var(--green);
        background: var(--green-soft);
        text-align: center;
        font-weight: 850;
      }

      [data-admin] .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      [data-admin] .field {
        min-width: 0;
      }

      [data-admin] .field-full {
        grid-column: 1 / -1;
      }

      [data-admin] label,
      [data-admin] legend {
        display: block;
        margin-bottom: 0.38rem;
        font-size: 0.9rem;
        font-weight: 780;
      }

      [data-admin] .required {
        color: var(--brick);
      }

      [data-admin] input:not([type="checkbox"]):not([type="file"]),
      [data-admin] select,
      [data-admin] textarea {
        width: 100%;
        min-height: 46px;
        padding: 0.72rem 0.78rem;
        border: 1px solid #bcb8ae;
        border-radius: 0.65rem;
        color: var(--ink);
        background: #fff;
      }

      [data-admin] textarea {
        min-height: 110px;
        resize: vertical;
      }

      [data-admin] input[type="file"] {
        width: 100%;
        padding: 0.85rem;
        border: 1px dashed #a79d89;
        border-radius: 0.65rem;
        background: var(--sand-soft);
      }

      [data-admin] input:focus-visible,
      [data-admin] select:focus-visible,
      [data-admin] textarea:focus-visible,
      [data-admin] button:focus-visible,
      [data-admin] a:focus-visible {
        outline: 3px solid rgba(31, 90, 61, 0.28);
        outline-offset: 2px;
      }

      [data-admin] .helper {
        margin: 0.35rem 0 0;
        font-size: 0.78rem;
      }

      [data-admin] .check-row {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
      }

      [data-admin] .check-row input {
        width: 1.15rem;
        height: 1.15rem;
        margin-top: 0.15rem;
        accent-color: var(--green);
      }

      [data-admin] .check-row label {
        margin: 0;
        font-weight: 700;
      }

      [data-admin] .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1rem;
      }

      [data-admin] .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.68rem 1rem;
        border: 1px solid transparent;
        border-radius: 0.65rem;
        cursor: pointer;
        font-weight: 800;
      }

      [data-admin] .button-primary {
        color: #fff;
        background: var(--green);
      }

      [data-admin] .button-secondary {
        border-color: var(--line);
        color: var(--ink);
        background: #fff;
      }

      [data-admin] .button-danger {
        border-color: rgba(161, 44, 44, 0.25);
        color: var(--danger);
        background: #fff4f2;
      }

      [data-admin] .button-small {
        min-height: 38px;
        padding: 0.48rem 0.7rem;
        font-size: 0.82rem;
      }

      [data-admin] .button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      [data-admin] .saved-area {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
      }

      [data-admin] .saved-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.8rem;
      }

      [data-admin] .saved-heading h3 {
        margin: 0;
      }

      [data-admin] .card-list {
        display: grid;
        gap: 0.75rem;
      }

      [data-admin] .saved-card {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 0.9rem;
        align-items: center;
        padding: 0.78rem;
        border: 1px solid var(--line);
        border-radius: 0.8rem;
        background: #fff;
      }

      [data-admin] .saved-card.no-image {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      [data-admin] .saved-card img {
        width: 76px;
        height: 62px;
        border-radius: 0.55rem;
        object-fit: cover;
        background: var(--sand);
      }

      [data-admin] .saved-card p {
        margin-bottom: 0.1rem;
      }

      [data-admin] .card-title {
        font-weight: 830;
      }

      [data-admin] .card-meta {
        font-size: 0.82rem;
      }

      [data-admin] .tag {
        display: inline-flex;
        margin-top: 0.35rem;
        padding: 0.2rem 0.48rem;
        border-radius: 999px;
        color: var(--brick-dark);
        background: var(--sand-soft);
        font-size: 0.73rem;
        font-weight: 800;
      }

      [data-admin] .material-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.9rem;
      }

      [data-admin] .material-card {
        margin: 0;
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 0.85rem;
      }

      [data-admin] .material-card legend {
        padding-inline: 0.35rem;
        color: var(--brick-dark);
        font-size: 1rem;
      }

      [data-admin] .material-card .field {
        margin-top: 0.85rem;
      }

      [data-admin] .tool-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.8rem;
      }

      [data-admin] .tool-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 0.85rem;
        background: var(--sand-soft);
      }

      [data-admin] .tool-card p {
        flex: 1;
        margin-bottom: 0.8rem;
        color: var(--muted);
        font-size: 0.86rem;
      }

      [data-admin] .import-label {
        margin: 0;
      }

      [data-admin] #importFile {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      [data-admin] .status-message {
        position: fixed;
        z-index: 30;
        right: 1rem;
        bottom: 1rem;
        width: min(380px, calc(100% - 2rem));
        margin: 0;
        padding: 0.8rem 1rem;
        border: 1px solid rgba(31, 90, 61, 0.25);
        border-radius: 0.75rem;
        color: var(--green);
        background: #f1fff6;
        box-shadow: 0 12px 32px rgba(23, 35, 28, 0.18);
        font-weight: 750;
      }

      [data-admin] .status-message:empty {
        display: none;
      }

      [data-admin] .status-message[data-kind="error"] {
        border-color: rgba(161, 44, 44, 0.28);
        color: var(--danger);
        background: #fff3f1;
      }

      [data-admin] .admin-footer {
        padding: 1.5rem 0 2.5rem;
        color: var(--muted);
        text-align: center;
        font-size: 0.82rem;
      }

      @media (max-width: 760px) {
        [data-admin] .admin-header {
          align-items: flex-start;
        }

        [data-admin] .brand small {
          display: none;
        }

        [data-admin] .intro,
        [data-admin] .form-grid,
        [data-admin] .material-grid,
        [data-admin] .tool-grid {
          grid-template-columns: 1fr;
        }

        [data-admin] .local-badge {
          justify-self: start;
        }

        [data-admin] .field-full {
          grid-column: auto;
        }
      }

      @media (max-width: 520px) {
        [data-admin] .admin-header,
        [data-admin] .admin-main {
          width: min(100% - 1rem, 1120px);
        }

        [data-admin] .preview-notice {
          font-size: 0.86rem;
        }

        [data-admin] .brand-mark {
          width: 2.35rem;
          height: 2.35rem;
        }

        [data-admin] .back-link {
          min-height: 40px;
          padding: 0.52rem 0.7rem;
          font-size: 0.82rem;
        }

        [data-admin] .saved-card,
        [data-admin] .saved-card.no-image {
          grid-template-columns: 58px minmax(0, 1fr);
        }

        [data-admin] .saved-card.no-image::before {
          display: grid;
          width: 58px;
          height: 52px;
          place-items: center;
          border-radius: 0.5rem;
          content: "B";
          color: var(--brick-dark);
          background: var(--sand-soft);
          font-weight: 900;
        }

        [data-admin] .saved-card img {
          width: 58px;
          height: 52px;
        }

        [data-admin] .saved-card .button {
          grid-column: 1 / -1;
          width: 100%;
        }

        [data-admin] .actions .button {
          flex: 1 1 100%;
        }
      }
    </style>
  </head>
<body data-admin><div id="dashboard"><main class="admin-main"><h1>Owner dashboard</h1><p id="loading" role="status">Loading secure shared content…</p></main></div><script src="/admin.js" defer></script></body></html>
